global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: isolated-lab

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: supportflow-backend
    metrics_path: /actuator/prometheus
    scheme: http
    scrape_timeout: 5s
    basic_auth:
      username: lab-ops
      password_file: /run/secrets/lab_ops_password
    static_configs:
      - targets: [backend:9091]
