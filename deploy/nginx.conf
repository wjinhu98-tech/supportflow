worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Public request paths/query strings can contain order numbers. Do not log them.
    log_format lab_minimal '$request_method $status $request_time $upstream_status';
    access_log /dev/stdout lab_minimal;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    client_max_body_size 64k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/supportflow;
        index index.html;
        add_header X-SupportFlow-Environment isolated-lab always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Management stays on backend:9091 and its separate loopback host port.
        location = /actuator { return 404; }
        location ^~ /actuator/ { return 404; }
        location = /api { return 404; }

        location ^~ /api/ {
            # A fixed target resolved at request time survives backend container recreation.
            set $lab_backend backend:8080;
            proxy_pass http://$lab_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRF-TOKEN $http_x_csrf_token;
            proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
            proxy_pass_header Set-Cookie;
            proxy_redirect off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 65s;
            # A failed upstream write must never be silently replayed.
            proxy_next_upstream off;
        }

        # Both buyer / and merchant /merchant are client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
