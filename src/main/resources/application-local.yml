spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/supportflow_rebuild?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
    username: supportflow_app
    password: "${SUPPORTFLOW_APP_PASSWORD}"

  flyway:
    enabled: true
    url: "${spring.datasource.url}"
    user: supportflow_migrator
    password: "${SUPPORTFLOW_MIGRATOR_PASSWORD}"
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    create-schemas: false

  config:
    import:
      - "file:./.local/secrets.yml"
      - "file:./.local/day4-security-secrets.yml"
      - "optional:file:./.local/reviewer-security.yml"
      - "optional:file:./.local/deepseek-secrets.yml"

supportflow:
  traffic:
    enabled: true
  rag:
    enabled: "${SUPPORTFLOW_RAG_ENABLED:true}"
    public-evidence-selection-enabled: "${SUPPORTFLOW_RAG_PUBLIC_SELECTION_ENABLED:true}"
    model-directory: "${SUPPORTFLOW_RAG_MODEL_DIRECTORY:.local/models/bge-small-zh-v1.5}"
    persistent-index-enabled: "${SUPPORTFLOW_RAG_PERSISTENT_INDEX_ENABLED:true}"
  after-sale:
    execution:
      enabled: true
  security:
    authentication:
      mode: database
      basic-enabled: false
      session-timeout: 30m
    local:
      accounts:
        - username: customer-200
          password-hash: "${SUPPORTFLOW_CUSTOMER_200_PASSWORD_HASH}"
          identity:
            buyer-id: 200
          permissions:
            - ORDER_READ
            - ORDER_CONFIRM_RECEIPT
