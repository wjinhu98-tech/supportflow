# Isolated, loopback-published teaching deployment. It never imports .local business configuration.
spring:
  config:
    import: "configtree:/run/secrets/"
  datasource:
    url: "jdbc:mysql://mysql:3306/supportflow_lab?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED"
    username: lab_app
    password: "${lab_app_password}"
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: SF_LAB_SESSION
        http-only: true
        same-site: lax

management:
  server:
    address: 0.0.0.0
    port: 9091
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include: health,prometheus,metrics
        exclude: ""
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      access: read-only
    metrics:
      access: read-only
  metrics:
    tags:
      application: supportflow-lab
    distribution:
      percentiles-histogram:
        http.server.requests: true

supportflow:
  rag:
    enabled: "${SUPPORTFLOW_RAG_ENABLED:false}"
    public-evidence-selection-enabled: "${SUPPORTFLOW_RAG_PUBLIC_SELECTION_ENABLED:false}"
    model-directory: "${SUPPORTFLOW_RAG_MODEL_DIRECTORY:/app/models/bge-small-zh-v1.5}"
    persistent-index-enabled: "${SUPPORTFLOW_RAG_PERSISTENT_INDEX_ENABLED:false}"
  ai:
    deepseek:
      enabled: false
      api-key: ""
  operations:
    enabled: true
    username: lab-ops
    password-hash: "${lab_ops_hash}"
  after-sale:
    execution:
      enabled: true
  security:
    authentication:
      mode: database
      basic-enabled: false
      session-timeout: 30m
