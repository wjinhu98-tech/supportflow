spring:
  application:
    name: supportflow-backend

  sql:
    init:
      mode: never

  flyway:
    enabled: false

management:
  endpoints:
    access:
      default: none
    jmx:
      exposure:
        exclude: "*"
    web:
      exposure:
        exclude: "*"

supportflow:
  agent:
    runtime:
      max-steps: 8
      total-timeout-seconds: 90
  after-sale:
    execution:
      enabled: false
  ai:
    deepseek:
      enabled: false
      api-key: "${DEEPSEEK_API_KEY:}"
      model: deepseek-flash
      connect-timeout: 3s
      request-timeout: 15s
      max-concurrent-requests: 4

