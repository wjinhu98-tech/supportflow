spring:
  application:
    name: supportflow-backend

  sql:
    init:
      mode: never

  flyway:
    enabled: false

supportflow:
  after-sale:
    execution:
      enabled: false
  ai:
    deepseek:
      enabled: false
      api-key: "${DEEPSEEK_API_KEY:}"
      model: deepseek-flash
      connect-timeout: 3s
      request-timeout: 15s
      max-concurrent-requests: 4

