name: Agent offline evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "scripts/*agent-evaluation*"
      - "scripts/setup-rag-model.ps1"
      - ".github/workflows/agent-evaluation.yml"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - "scripts/*agent-evaluation*"
      - "scripts/setup-rag-model.ps1"
      - ".github/workflows/agent-evaluation.yml"

permissions:
  contents: read

concurrency:
  group: agent-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test report comparison
        run: node --test scripts/compare-agent-evaluations.test.mjs
      - name: Prepare checksum-verified local Chinese embedding model
        shell: pwsh
        run: ./scripts/setup-rag-model.ps1
      - name: Evaluate local semantic retrieval and scoped publications
        run: >-
          mvn -B -ntp
          -Dtest=RagKnowledgeSearchTest,RagResourcesTest,PublicKnowledgeServiceTest,DeepSeekPublicKnowledgeSelectorTest,DeepSeekCallMetricsTest
          -Dit.test=LocalRagModelIT,LocalRagKnowledgeIT
          test-compile surefire:test failsafe:integration-test failsafe:verify
      - name: Evaluate fixed cases against temporary MySQL
        run: >-
          mvn -B -ntp
          -Dtest=AgentEvaluationContractTest
          -Dit.test=AgentScenarioEvaluationIT
          test-compile surefire:test failsafe:integration-test failsafe:verify
      - name: Regress product-name order resolution and legacy snapshots
        run: >-
          mvn -B -ntp
          -Dtest=ProductOrderQuestionTest,ProductOrderKeywordTest,ConversationContextEngineTest,OrderItemSnapshotTest,OrderResponseTest,OrderProductQueryServiceTest,OrderItemSnapshotJsonTest
          -Dit.test=ProductOrderChatIT,JdbcOrderProductSearchIT,DemoProductDataIT,DemoProductImageDataIT,LegacyDemoProductDataIT
          test-compile surefire:test failsafe:integration-test failsafe:verify
      - name: Publish readable job summary
        if: always()
        shell: bash
        run: |
          if [ -f target/agent-evaluation/latest.md ]; then
            cat target/agent-evaluation/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for report in target/knowledge-rag-evaluation/calibration.md target/knowledge-rag-evaluation/holdout.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-offline-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/agent-evaluation/*.json
            target/agent-evaluation/*.md
            target/knowledge-rag-evaluation/*.json
            target/knowledge-rag-evaluation/*.md
          if-no-files-found: warn
          retention-days: 14
